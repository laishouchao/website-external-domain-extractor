# ==============================================================================
# 网站外部域名提取与全深度网站地图系统 - Docker Compose 容器编排
# 使用命令: docker compose up -d
# ==============================================================================
version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. 爬虫与 Web 控制台核心服务
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domain_extractor_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=postgres_secure_pwd
      - PG_DATABASE=website_domain_db
      - PG_POOL_SIZE=25
      - CH_ENABLED=false
      - CH_HOST=clickhouse
      - CH_PORT=8123
      - HOST=0.0.0.0
      - PORT=8000
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 2. PostgreSQL 15 关系型数据库 (任务调度、整改工单、威胁情报元数据)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: domain_extractor_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: website_domain_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pwd
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d website_domain_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. ClickHouse OLAP 引擎 (可选：海量 3 亿+ 页面存证与日志快速检索)
  # 若资源有限可保持禁用，如需启用请将上方 web 服务的 CH_ENABLED 设为 true
  # ----------------------------------------------------------------------------
  # clickhouse:
  #   image: clickhouse/clickhouse-server:24.3-alpine
  #   container_name: domain_extractor_clickhouse
  #   restart: unless-stopped
  #   ports:
  #     - "8123:8123"
  #     - "9000:9000"
  #   environment:
  #     CLICKHOUSE_DB: website_domain_db
  #     CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
  #   volumes:
  #     - chdata:/var/lib/clickhouse
  #   ulimits:
  #     nofile:
  #       soft: 262144
  #       hard: 262144

volumes:
  pgdata:
    driver: local
  # chdata:
  #   driver: local
